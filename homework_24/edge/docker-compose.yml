services:
  c2_service:
    # build: локальна збiрка для розробки та тестування ДЗ.
    # На реальнiй цiльовiй машинi вихiдного коду немає, тому
    # замiсть build: зазвичай використовується image: з готовим образом.
    build:
      context: ./c2
      dockerfile: Dockerfile
    depends_on:
      auto_stub:
        # auto_stub у цьому образi нiколи не стає healthy (healthcheck nc -z localhost 7777
        # не знаходить жодного слухача на 7777 попри те, що процес коректно генерує waypoints
        # - схоже на ваду самого образу). service_healthy тут вiчно блокував би c2_service.
        condition: service_started
    volumes:
      - ./config/c2_config.json:/etc/c2/c2_config.json:ro  # конфiг лише для читання
      - ./logs:/var/log/c2                                 # логи видно на хостi пiсля stop
    ports:
      - "14551:14551/udp"  # лишаємо публiкацiю порту для дiагностики/пiдключення з хоста
    networks:
      - default    # тут же auto_stub (той самий compose-проєкт)
      - mavnet     # спiльна мережа з sim/ стеком: UDP hairpin через host.docker.internal
                   # ненадiйний на Docker Desktop macOS, тому fc_sim ходить сюди напряму по iменi контейнера
    restart: unless-stopped     # для основного C2-сервiсу очiкується unless-stopped

  auto_stub:
    # Готовий stub для генерацiї точок маршруту. C2-сервiс має лише приймати
    # його JSON-команди та вирiшувати, коли їх можна передавати в FC.
    image: ghcr.io/yevhenkuznetsov/hw12-auto-stub:latest
    environment:
      C2_HOST: "c2_service"  # той самий compose-стек: доступний за iм'ям сервiсу
      C2_PORT: "14560"
      # auto_stub читає той самий маршрут, який можна вiдкрити в QGC.
      ROUTE_PLAN: "/opt/route/lyman-patrol.plan"
      # auto_stub не читає телеметрiю, тому перемикає точки маршруту за таймером.
      WAYPOINT_INTERVAL_SEC: "45"
    volumes:
      - ../qgc:/opt/route:ro

networks:
  mavnet:
    name: mavnet  # фiксована назва, спiльна з sim/ стеком
    # без external: true - Compose сам створює мережу при першому запуску
    # (edge/ чи sim/, незалежно вiд порядку) i повторно використовує її при другому,
    # тому ручний docker network create mavnet бiльше не потрiбен.
