services:
  fc_sim:
    build: .
    container_name: fc_sim
    environment:
      VEHICLE: Rover
      SPEEDUP: "1"
      # network_mode: host прибрано (не працює на Docker Desktop macOS), тому
      # 127.0.0.1 всерединi контейнера бiльше не вказує на хост.
      # host.docker.internal - спецiальне iм'я Docker Desktop для доступу до хоста.
      GCS_HOST: "${GCS_HOST:-host.docker.internal}"
      GCS_PORT: "14550"
      # c2_service тепер у спiльнiй мережi mavnet (див. edge/docker-compose.yml):
      # UDP hairpin через host.docker.internal ненадiйний на Docker Desktop macOS,
      # тому йдемо напряму по iменi контейнера в тiй самiй мережi.
      C2_HOST: "${C2_HOST:-c2_service}"
      C2_PORT: "14551"
      # Стартова позицiя SITL
      LAT: "48.983498065911704"
      LON: "37.82220625228142"
      ALT: "95"
      DIR: "90"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # для Docker Engine на Linux; на Mac/Windows зайве, але не заважає
    networks:
      - default
      - mavnet     # спiльна з edge/ стеком: тут живе c2_service
    restart: unless-stopped

networks:
  mavnet:
    name: mavnet  # фiксована назва, спiльна з edge/ стеком
    # без external: true - Compose сам створює мережу при першому запуску
    # (edge/ чи sim/, незалежно вiд порядку) i повторно використовує її при другому,
    # тому ручний docker network create mavnet бiльше не потрiбен.
